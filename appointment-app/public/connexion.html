<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/connexion.js" defer></script>
</head>
<body>
  <header class="top"><h1>Espace direction &amp; sécurité</h1><a class="btn ghost" href="/">Formulaire public</a></header>
  <main class="narrow">
    <form id="login" class="card" novalidate>
      <h2>Connexion</h2>
      <div id="erreur" class="alert error" role="alert" hidden></div>
      <div>
        <label for="username">Identifiant</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" required>
      </div>
      <div data-mt>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="actions end"><button type="submit">Se connecter</button></div>
    </form>
  </main>
</body>
</html>
