<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contrôle des rendez-vous — Sécurité</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/securite.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Contrôle d’accès — Rendez-vous</h1>
    <div class="user"><span id="utilisateur"></span><button type="button" class="link" id="deconnexion">Déconnexion</button></div>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" class="secondary" id="precedent" aria-label="Jour précédent">‹</button>
      <div><label for="date">Date</label><input type="date" id="date"></div>
      <button type="button" class="secondary" id="suivant" aria-label="Jour suivant">›</button>
      <button type="button" class="secondary" id="aujourdhui">Aujourd’hui</button>
    </div>
    <h2 id="titre"></h2>
    <div class="stats" id="stats"></div>
    <div id="message" class="alert" role="status" hidden></div>
    <p class="hint">Consultation seule. Cochez la case lorsque le visiteur s’est effectivement présenté (le jour même uniquement).</p>
    <div id="liste"></div>
  </main>
</body>
</html>
