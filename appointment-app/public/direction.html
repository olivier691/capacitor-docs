<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rendez-vous — Direction</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/direction.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Rendez-vous du PDG</h1>
    <div class="user"><span id="utilisateur"></span><button type="button" class="link" id="deconnexion">Déconnexion</button></div>
  </header>
  <main class="wide">
    <div class="tabs" role="tablist" id="onglets">
      <button type="button" role="tab" data-statut="en_attente" aria-selected="true">À traiter</button>
      <button type="button" role="tab" data-statut="valide">Validés</button>
      <button type="button" role="tab" data-statut="refuse">Refusés</button>
      <button type="button" role="tab" data-statut="annule">Annulés</button>
      <button type="button" role="tab" data-statut="">Tous</button>
    </div>
    <div id="message" class="alert" role="status" hidden></div>
    <div id="liste"></div>
  </main>

  <dialog id="dialogue">
    <form method="dialog" id="dialogue-form">
      <h2 id="dialogue-titre"></h2>
      <p id="dialogue-texte" class="hint"></p>
      <div id="dialogue-creneau" class="grid cols-3">
        <div><label for="d-date">Date</label><input id="d-date" name="date" type="date"></div>
        <div><label for="d-heure">Heure</label><input id="d-heure" name="heure" type="time" step="900"></div>
        <div><label for="d-duree">Durée (min)</label>
          <select id="d-duree" name="duree">
            <option>15</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option>
          </select>
        </div>
      </div>
      <div data-mt>
        <label for="d-note" id="d-note-label">Note</label>
        <textarea id="d-note" name="note" maxlength="500" rows="3"></textarea>
      </div>
      <label class="check" data-mt><input type="checkbox" id="d-informer" checked> <span>Informer le demandeur par e-mail</span></label>
      <div class="actions end">
        <button type="button" class="secondary" id="d-annuler">Fermer</button>
        <button type="submit" id="d-confirmer">Confirmer</button>
      </div>
    </form>
  </dialog>
</body>
</html>
